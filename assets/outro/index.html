<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="card"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
        data-start="0"
        data-duration="9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- The sound logo: a vibraphone chord (E, B, E) over a full, pitched low E whose fade follows the chord's,
           struck as the mascot lands (its attack at 0.633 s). Made in code; see sound-sets/README.md. -->
      <audio
        id="sfx-logo"
        class="clip"
        src="assets/sfx/braian-logo.wav"
        data-start="0.632"
        data-duration="4.306"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
