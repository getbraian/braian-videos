<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="card"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- The sound logo: a whoosh as the mascot sweeps in, a bass hit as it lands, a sparkle as "AI" lights up.
           Each file's peak lands one frame after its picture (peaks measured with `hyperframes audio`). -->
      <audio
        id="sfx-whoosh"
        class="clip"
        src="assets/sfx/whoosh-short.mp3"
        data-start="0.17"
        data-track-index="2"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-impact"
        class="clip"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="0.58"
        data-track-index="3"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-sparkle"
        class="clip"
        src="assets/sfx/sparkle.mp3"
        data-start="1.86"
        data-track-index="4"
        data-volume="0.28"
        data-fade-out="0.4"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
