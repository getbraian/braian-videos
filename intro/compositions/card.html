<html
  data-composition-variables='[
    {"id":"tagline","type":"string","label":"Punch line","default":"Your second brain, wired.","maxLength":40},
    {"id":"accent","type":"color","label":"Accent","default":"#4daafc"}
  ]'
>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        --accent: #4daafc;
        --ink: #ffffff;
        --muted: #aab3c8;
      }
      /* The icon's own ground: the Icon Composer gradient of the desktop app icon. */
      #card-ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 80% at 50% 42%, #283562 0%, #141c3a 55%, #0b1024 100%);
      }
      #card-glow {
        position: absolute;
        left: 660px;
        top: 130px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 65%);
        opacity: 0;
      }
      #card-stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #card-mascot {
        width: 440px;
        height: 440px;
        display: block;
      }
      #card-title {
        margin-top: 18px;
        color: var(--ink);
        font-size: 104px;
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      #card-title span {
        display: inline-block;
      }
      #card-tagline {
        margin-top: 22px;
        color: var(--muted);
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
    </style>

    <div id="root" data-composition-id="card" data-width="1920" data-height="1080">
      <div id="card-ground"></div>
      <div id="card-glow"></div>
      <div id="card-stack">
        <img id="card-mascot" src="assets/mascot.png" alt="BrAIan" />
        <h1 id="card-title" data-layout-allow-overlap>
          <span class="card-l">B</span><span class="card-l">r</span><span class="card-l card-ai">A</span><span
            class="card-l card-ai"
            >I</span
          ><span class="card-l">a</span><span class="card-l">n</span>
        </h1>
        <p id="card-tagline" data-var-text="tagline">Your second brain, wired.</p>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const accent = (window.__hyperframes?.getVariables?.() || {}).accent || "#4daafc";

      // 0.0–0.4  the ground rises out of black
      tl.fromTo("#card-ground", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

      // 0.2–0.8  the mascot sweeps in from a blur and lands with a soft overshoot (whoosh, then the bass hit)
      tl.fromTo(
        "#card-mascot",
        { opacity: 0, filter: "blur(14px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" },
        0.2,
      );
      tl.fromTo(
        "#card-mascot",
        { scale: 0.55, y: 150 },
        { scale: 1, y: 90, duration: 0.6, ease: "back.out(1.6)" },
        0.2,
      );
      tl.fromTo("#card-glow", { opacity: 0, scale: 0.6 }, { opacity: 0.35, scale: 1, duration: 0.9, ease: "expo.out" }, 0.55);

      // 1.15–1.7  the mascot rises to make room; the name arrives letter by letter
      tl.fromTo("#card-mascot", { y: 90 }, { y: 0, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 1.15);
      tl.fromTo("#card-glow", { y: 90 }, { y: 0, duration: 0.55, ease: "power3.inOut" }, 1.15);
      tl.fromTo(
        "#card-title .card-l",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.06 },
        1.38,
      );

      // 1.85  "AI" lights up in the accent colour (the sparkle)
      tl.fromTo(
        "#card-title .card-ai",
        { color: "#ffffff", textShadow: "0 0 0px rgba(77,170,252,0)" },
        { color: accent, textShadow: "0 0 28px rgba(77,170,252,0.55)", duration: 0.25, ease: "power2.out" },
        1.85,
      );

      // 2.1  the punch line blurs in as one line, then everything holds dead still
      tl.fromTo(
        "#card-tagline",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        2.1,
      );

      // 4.1–4.95  fade out to black
      tl.to("#card-stack", { opacity: 0, filter: "blur(10px)", scale: 0.97, duration: 0.6, ease: "power2.in" }, 4.1);
      tl.to("#card-glow", { opacity: 0, duration: 0.6, ease: "power2.in" }, 4.1);
      tl.to("#card-ground", { opacity: 0, duration: 0.7, ease: "power2.in" }, 4.2);

      window.__timelines["card"] = tl;
    </script>
  </template>
</html>
